name: Overnight Scanner

on:
  schedule:
    - cron: '55 7 * * 1-5'

  workflow_dispatch:

jobs:

  scan:

    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Packages
        run: |
          pip install -r requirements.txt

      - name: Run Scanner
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}

        run: |
          python scanner3.py
